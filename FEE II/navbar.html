<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAVBAR</title>
    <style>
        .box{
            width:100%;
            height:50px;
            background-color: black;
            display:flex;
            justify-content:space-around;
            align-items:center;
        }
        .child{
            color:aliceblue;
            font-size: 20px;
 
        }
        .login{
            margin:auto;
            margin-top:200px;
            width:450px;
            height:400px;
            background-color:pink;
        }
        .user{
            border:2px solid black;
            color:black;
            background-color:beige;
            margin:50px;
            height:35px;
            border-radius: 10px;
        }
        .submit{
             border:2px solid black;
            color:black;
            background-color:red;
            margin:50px;
            height:35px;
            text-align: center;
        }
        .body{
            background-color: skyblue;
        }
    </style>
</head>
<body class="body">
    <div class="box">
        <div class="child"><u>Home</u></div>
        <div class="child"><u>About Us</u></div>
        <div class="child"><u>Contact</u></div>
        <div class="child"><u>History</u></div>
    </div>

    <div class="login">
        <p style=text-align:center;font-size:40px;>Welcome Back</p>
        <div class="user">Username</div>
        <div class="user">password</div>
        <div class="submit">login</div>
    </div>

    </div>
</body>
</html>
