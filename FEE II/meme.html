<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekend Energy</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    width:450px;
    text-align:center;
}

h1{
    margin-bottom:30px;
}

.bar{
    height:30px;
    background:#333;
    border-radius:20px;
    overflow:hidden;
    margin-bottom:30px;
}

/* Monday */
.monday{
    height:100%;
    width:100%;
    background:lime;
    animation:monday 5s forwards;
}

/* Friday */
.friday{
    height:100%;
    width:5%;
    background:red;
    animation:friday 5s forwards;
}

@keyframes monday{
    from{
        width:100%;
        background:lime;
    }
    to{
        width:5%;
        background:red;
    }
}

@keyframes friday{
    from{
        width:5%;
        background:red;
    }
    to{
        width:100%;
        background:lime;
    }
}

h2{
    margin-bottom:10px;
}
</style>
</head>
<body>

<div class="box">

    <h1>⚡ Student Energy Meter</h1>

    <h2>😭 Monday</h2>
    <div class="bar">
        <div class="monday"></div>
    </div>

    <h2>🥳 Friday</h2>
    <div class="bar">
        <div class="friday"></div>
    </div>

</div>

</body>
</html>
